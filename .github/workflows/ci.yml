# ==============================================================================
# Workflow: Core Hexagon CI & GitHub Packages Publisher
# Repository: festival-tap/core
# ==============================================================================
#
# Purpose:
#   Automates continuous integration and ordered artifact publication for the
#   two-module Java 24 hexagon core (`core-ports` -> `core-domain`).
#
# Build & Release Order:
#   1. Deploy parent POM + `core-ports` first (on push to `main`) so downstream
#      consumers (`festival-tap/persistence`) can resolve updated contracts.
#   2. Verify `core-domain` against `com.festivaltap:persistence` in test scope.
#   3. Deploy `core-domain` to GitHub Packages (on push to `main`).
#
# Authentication Note:
#   - Uses `GH_PACKAGES_TOKEN` (Classic PAT with `write:packages` & `read:packages`)
#     if configured in org/repo secrets, falling back to `GITHUB_TOKEN`.
#   - Ensure `festival-tap` org Settings -> Actions -> General -> Workflow
#     permissions is set to "Read and write permissions".
# ==============================================================================

name: Core Hexagon CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  MAVEN_SETTINGS: /tmp/settings.xml

jobs:
  build-and-test:
    name: Build, Verify & Publish (JDK 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven settings for GitHub Packages
        run: |
          cat << EOF > "${MAVEN_SETTINGS}"
          <settings>
            <servers>
              <server>
                <id>github-festival-tap</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-sugarcoat</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # 1. On pull requests: verify core-ports compiles cleanly without publishing
      - name: Verify core-ports (PR)
        if: github.event_name == 'pull_request'
        run: mvn -B -s "${MAVEN_SETTINGS}" -pl core-ports clean verify

      # 2. On push to main: publish parent POM and core-ports first so persistence can resolve it
      - name: Publish parent POM and core-ports to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mvn -B -s "${MAVEN_SETTINGS}" -N deploy
          mvn -B -s "${MAVEN_SETTINGS}" -pl core-ports clean deploy

      # 3. Compile core-domain and run behavioral tests backed by Persistence.jdk()
      - name: Verify core-domain
        run: mvn -B -s "${MAVEN_SETTINGS}" -pl core-domain clean verify

      # 4. Publish core-domain to GitHub Packages on push to main
      - name: Publish core-domain to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn -B -s "${MAVEN_SETTINGS}" -pl core-domain deploy -DskipTests
