# ==============================================================================
# SPEC (Source of Truth):
# - Workflow: Core Hexagon CI & GitHub Packages Publisher (`festival-tap/core`).
# - Triggers: Runs on every push or pull request targeting `main`.
# - Runtime & Build: Uses `ubuntu-latest` with Eclipse Temurin JDK 24 and Maven
#   dependency caching (`actions/setup-java@v5`).
# - Credentials & Repositories: Generates `${MAVEN_SETTINGS}` (`/tmp/settings.xml`)
#   with `<server>` entries for `github-festival-tap` and `github-sugarcoat-labs`
#   using `${GITHUB_ACTOR}` and `${PACKAGES_TOKEN}` (`secrets.GH_PACKAGES_TOKEN`
#   falling back to `secrets.GITHUB_TOKEN`), resolving `com.sugarcoatlabs`
#   `1.0.0` persistence artifacts and `com.festivaltap:persistence`.
# - Pull Requests: Runs `mvn -B -s "${MAVEN_SETTINGS}" -pl core-ports clean verify`
#   without publishing.
# - Pushes to `main`:
#     1. Deploys the parent POM (`mvn -B -s "${MAVEN_SETTINGS}" -N deploy`) and
#        `core-ports` (`mvn -B -s "${MAVEN_SETTINGS}" -pl core-ports clean deploy`)
#        first so downstream consumers (`festival-tap/persistence`) can resolve
#        updated contracts.
#     2. Verifies `core-domain` (`mvn -B -s "${MAVEN_SETTINGS}" -pl core-domain clean verify`)
#        against `com.festivaltap:persistence` in test scope.
#     3. Deploys `core-domain` (`mvn -B -s "${MAVEN_SETTINGS}" -pl core-domain deploy -DskipTests`)
#        to GitHub Packages (`https://maven.pkg.github.com/festival-tap/core`).
# - Permissions: Requires `contents: read` and `packages: write`, plus
#   `Read and write permissions` under `festival-tap` org Settings -> Actions ->
#   General -> Workflow permissions when using `GITHUB_TOKEN`.
# ==============================================================================

name: Core Hexagon CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  MAVEN_SETTINGS: /tmp/settings.xml
  MAVEN_OPTS: "-Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true"

jobs:
  build-and-test:
    name: Build, Verify & Publish (JDK 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven settings for GitHub Packages
        run: |
          cat << EOF > "${MAVEN_SETTINGS}"
          <settings>
            <servers>
              <server>
                <id>github-festival-tap</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-sugarcoat-labs</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # 1. On pull requests: verify core-ports compiles cleanly without publishing
      - name: Verify core-ports (PR)
        if: github.event_name == 'pull_request'
        run: mvn -B -s "${MAVEN_SETTINGS}" -pl core-ports clean verify

      # 2. On push to main: publish parent POM and core-ports first so persistence can resolve it
      - name: Publish parent POM and core-ports to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mvn -B -s "${MAVEN_SETTINGS}" -N deploy
          mvn -B -s "${MAVEN_SETTINGS}" -pl core-ports clean deploy

      # 3. Compile core-domain and run behavioral tests backed by Persistence.jdk()
      - name: Verify core-domain
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: mvn -B -s "${MAVEN_SETTINGS}" -pl core-domain clean verify

      # 4. Publish core-domain to GitHub Packages on push to main
      - name: Publish core-domain to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn -B -s "${MAVEN_SETTINGS}" -pl core-domain deploy -DskipTests